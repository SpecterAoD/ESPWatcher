# OTA-Server fuer den ESPWatcher (nur lesend, nur im LAN).
# Ablegen als /etc/nginx/conf.d/espwatcher-ota.conf, danach:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port 80 gehoert dem Pi-hole-Webinterface; dieser Server nutzt bewusst 8091.

server {
    listen 192.168.2.6:8091;
    server_name _;

    root /srv/espwatcher-ota;

    # Nur LAN, nichts ueber Tailscale oder von aussen
    allow 192.168.2.0/24;
    deny all;

    access_log off;
    autoindex off;
    server_tokens off;

    # Nur die beiden benoetigten Dateien ausliefern
    location = /manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /firmware.bin {
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
